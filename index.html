<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הליגה שלנו</title>
<meta name="description" content="תוצאות, טבלה וסטטיסטיקה של הליגה">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020; --bg2:#10172b; --card:#141c33; --card2:#1a2440; --line:#24304f;
  --text:#eef2ff; --muted:#93a0c2; --dim:#5f6c90;
  --accent:#ff7a1a; --accent2:#ffb067; --accent-ink:#1a0d02;
  --win:#2fd28a; --loss:#ff5d6c; --blue:#5aa7ff; --gold:#ffd166;
  --r:16px; --r-sm:10px;
  --shadow:0 10px 30px -12px rgba(0,0,0,.55);
  --font:"Rubik","Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f3f5fb; --bg2:#e9edf7; --card:#ffffff; --card2:#f4f6fc; --line:#dde3f0;
  --text:#121a33; --muted:#5b6788; --dim:#8b96b3;
  --accent:#f26a0b; --accent2:#ff9a4d; --accent-ink:#ffffff;
  --win:#13a868; --loss:#e23b4c; --blue:#2f7fe0; --gold:#d79b00;
  --shadow:0 8px 24px -14px rgba(20,30,70,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;
  min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(700px 380px at 85% -80px,rgba(255,122,26,.16),transparent 70%),
             radial-gradient(600px 400px at -10% 10%,rgba(90,167,255,.10),transparent 70%)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.num,td,th{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand .ball{width:34px;height:34px;flex:none}
.brand b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.brand small{color:var(--muted);font-size:12px;display:block;margin-top:-2px}
.topnav{display:flex;gap:4px}
.topnav a{padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:500}
.topnav a.on{background:var(--card2);color:var(--text)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn.admin-on{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* bottom nav (mobile app feel) */
.bnav{position:fixed;bottom:0;inset-inline:0;z-index:40;background:color-mix(in srgb,var(--bg2) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--dim);font-size:11px;font-weight:500}
.bnav a svg{width:22px;height:22px}
.bnav a.on{color:var(--accent)}
@media(min-width:860px){.bnav{display:none}body{padding-bottom:40px}}
@media(max-width:859px){.topnav{display:none}}

main{padding:18px 0 30px}
h1{font-size:24px;margin:4px 0 14px;letter-spacing:-.01em}
h2{font-size:17px;margin:0;letter-spacing:-.01em}
.sec{margin:22px 0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sec-h a.more{color:var(--accent);font-size:13px;font-weight:500}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.hero{padding:20px;border-radius:22px;background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-start:-60px;bottom:-90px;width:240px;height:240px;border-radius:50%;
  border:34px solid rgba(255,122,26,.12)}
.hero h1{margin:0 0 4px;font-size:26px}
.kpis{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px}
.kpi b{display:block;font-size:22px}
.kpi span{color:var(--muted);font-size:12px}

/* team badge */
.tb{display:inline-flex;align-items:center;gap:8px;min-width:0}
.tb .dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none;
  text-shadow:0 1px 1px rgba(0,0,0,.35);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.tb.lg .dot{width:54px;height:54px;border-radius:16px;font-size:18px}
.tb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 10px;text-align:center;white-space:nowrap;unicode-bidi:plaintext}
.kpi b,.tile b,.sc,.score span{unicode-bidi:plaintext}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--card2);position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sorted{color:var(--accent)}
tbody tr{border-top:1px solid var(--line)}
tbody tr:hover{background:color-mix(in srgb,var(--card2) 70%,transparent)}
td.l,th.l{text-align:start;unicode-bidi:normal}
.sticky-col{position:sticky;inset-inline-start:0;background:var(--card);z-index:1}
th.sticky-col{background:var(--card2);z-index:2}
tbody tr:hover .sticky-col{background:var(--card2)}
tr.tot td{font-weight:700;background:var(--card2)}
.rk{color:var(--dim);width:28px}
.rk.top{color:var(--accent);font-weight:700}
.pts{font-weight:700;color:var(--text)}
.pos{color:var(--win)} .neg{color:var(--loss)}
.form{display:inline-flex;gap:3px}
.form i{width:18px;height:18px;border-radius:5px;font-size:10px;font-style:normal;display:grid;place-items:center;font-weight:700;color:#fff}
.form i.W{background:var(--win)} .form i.L{background:var(--loss)}

/* game cards */
.gc{display:block;padding:12px 14px}
.gc .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:8px}
.gc .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:3px 0}
.gc .row .sc{font-size:20px;font-weight:700;min-width:36px;text-align:end}
.gc .row.lose{color:var(--muted)} .gc .row.lose .sc{font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.chip.final{color:var(--win);border-color:color-mix(in srgb,var(--win) 40%,transparent)}
.chip.live{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}

/* scoreboard */
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:20px 16px;text-align:center}
.sb .tm{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.sb .tm b{font-size:16px}
.sb .score{font-size:44px;font-weight:800;letter-spacing:-.02em;display:flex;gap:14px;align-items:center}
.sb .score .w{color:var(--text)} .sb .score .l{color:var(--dim)}
.sb .score em{font-style:normal;color:var(--dim);font-size:24px}

/* leaders */
.ld h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between}
.ld ol{list-style:none;margin:0;padding:0}
.ld li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.ld li:first-child{border-top:0}
.ld li .v{margin-inline-start:auto;font-weight:700;font-size:16px}
.ld li:first-child .v{color:var(--accent);font-size:20px}
.ld .who{min-width:0}
.ld .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ld .who small{color:var(--muted)}
.jn{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--card2);font-weight:700;font-size:12px;flex:none}

/* stat tiles */
.tile{padding:12px 14px}
.tile span{display:block;color:var(--muted);font-size:12px}
.tile b{font-size:24px}
.tile small{color:var(--dim);font-size:12px}

/* forms & buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--card2);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.danger{color:var(--loss)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg2);color:var(--text);outline:none}
.inp:focus{border-color:var(--accent)}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
input[type=color].inp{padding:4px;height:42px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs a,.tabs button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
.tabs .on{background:var(--text);color:var(--bg);border-color:transparent}

/* box editor */
.bx input{width:46px;padding:7px 4px;text-align:center;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--text)}
.bx input:focus{border-color:var(--accent);outline:none}
.bx td{padding:5px 4px}
.bx tr.off td:not(.sticky-col){opacity:.35}
.colpick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.colpick button{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:12px;color:var(--muted)}
.colpick button.on{background:color-mix(in srgb,var(--accent) 18%,var(--card));color:var(--text);border-color:var(--accent)}

/* tap mode */
.tap{display:grid;gap:12px}
.pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pl-btn{padding:10px 6px;border-radius:12px;border:2px solid var(--line);background:var(--card2);cursor:pointer;text-align:center;min-height:64px}
.pl-btn b{display:block;font-size:20px}
.pl-btn span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-btn em{font-style:normal;font-size:11px;color:var(--accent)}
.pl-btn.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card2))}
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.act{padding:14px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:15px}
.act.g{background:color-mix(in srgb,var(--win) 16%,var(--card));border-color:color-mix(in srgb,var(--win) 40%,transparent)}
.act.r{background:color-mix(in srgb,var(--loss) 12%,var(--card));border-color:color-mix(in srgb,var(--loss) 35%,transparent)}
.act:active,.pl-btn:active{transform:scale(.97)}
.log{max-height:180px;overflow:auto;font-size:13px}
.log div{padding:5px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between}

/* misc */
.banner{padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--gold) 14%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);font-size:13px;margin-bottom:14px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:8px}
.save-pill{position:fixed;top:70px;inset-inline-start:16px;z-index:50;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);cursor:default}
.save-pill.ok{color:var(--win)} .save-pill.err{color:var(--loss);cursor:pointer} .save-pill.busy{color:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(5,8,18,.6);z-index:80;display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px)}
.modal{width:100%;max-width:440px;padding:20px;max-height:90vh;overflow:auto}
.modal h2{margin-bottom:12px}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:90;background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:500;font-size:14px;box-shadow:var(--shadow);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.list-row .grow{flex:1;min-width:0}
.badge{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.hide{display:none!important}
.split{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar{height:6px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.search{position:relative}
.search input{padding-inline-start:36px}
.search svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim)}
@media(max-width:560px){
  h1{font-size:21px}.hero h1{font-size:22px}.sb .score{font-size:36px}
  th,td{padding:9px 7px}
}

/* מפת זריקות */
.court-wrap svg{width:100%;max-width:460px;display:block;margin:10px auto 6px}
svg.court{background:color-mix(in srgb,var(--accent) 7%,var(--card2));border-radius:14px}
svg.court.int{cursor:crosshair;touch-action:manipulation}
.court-lines{stroke:var(--dim);opacity:.75}
.shot-in{fill:var(--win);stroke:var(--card);stroke-width:2.5}
.shot-out path{stroke:var(--loss);stroke-width:3.5;stroke-linecap:round}
.shot-pend{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:5 4}
.shot-pend-dot{fill:var(--accent)}
.lg-in{color:var(--win)} .lg-out{color:var(--loss);font-weight:700}
.shot-pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:6px}
.shot-pick .act{padding:12px 18px;min-width:110px}

/* חלוקת נקודות */
.stack{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 8px;background:var(--card2)}
.stack i{display:block;min-width:4px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--text)}

/* גרף לאורך העונה */
.trend{position:relative;display:flex;align-items:flex-end;gap:6px;height:190px;padding:22px 0 22px;overflow-x:auto}
.tb-col{flex:1;min-width:26px;max-width:56px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;position:relative}
.tb-col i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;opacity:.85;position:relative}
.tb-col:hover i{opacity:1}
.tb-col b{position:absolute;top:-17px;inset-inline:0;text-align:center;font-size:12px;color:var(--text)}
.tb-col span{position:absolute;bottom:-20px;font-size:10px;color:var(--dim);white-space:nowrap}
.trend-avg{position:absolute;inset-inline:0;bottom:calc(22px + (100% - 44px) * var(--avg));border-top:1.5px dashed var(--dim);pointer-events:none;z-index:1}
.trend-avg span{position:absolute;top:-17px;inset-inline-start:0;font-size:11px;color:var(--muted);background:var(--card);padding:0 4px}

/* השוואת קבוצות */
.cmp-l{text-align:center;font-size:12px;color:var(--muted);margin-top:10px}
.cmp-l:first-child{margin-top:0}
.cmp-row{display:grid;grid-template-columns:76px 1fr 76px;align-items:center;gap:10px}
.cmp-track{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;background:var(--card2)}
.cmp-track i{display:block;opacity:.9}
.cv{font-weight:500;text-align:center;unicode-bidi:plaintext}
.cv small{display:block;font-size:11px;color:var(--dim);font-weight:400}
.cv.best{font-weight:800;color:var(--text)}

/* בוקס סקור וכרטיס שחקן */
tr.clickrow{cursor:pointer}
tr.clickrow:hover .pn{color:var(--accent)}
.box td.strong{font-weight:700}
td.best-cell{color:var(--accent);font-weight:800}
.best-key{color:var(--accent);font-weight:800}
tr.pctrow td{font-weight:500;color:var(--muted);font-size:13px}
.modal.wide{max-width:720px}
.pg-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.pg-head h2{margin:0}
.pg-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pg-stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.pg-stat b{display:block;font-size:28px;line-height:1.1}
.pg-stat span{font-size:12px;color:var(--muted)}
.pg-stat small{display:block;font-size:11px;color:var(--dim)}
.pg-h{font-size:14px;margin:18px 0 8px;color:var(--muted);font-weight:600}
.pg-adv .tile{box-shadow:none}
.pg-adv .tile b{font-size:20px}

/* מגירות נפתחות */
.accs{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.acc-h{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.acc-h:hover{background:color-mix(in srgb,var(--card2) 60%,transparent)}
.acc-h:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.acc-i{width:38px;height:38px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:18px;flex:none}
.acc-t{flex:1;min-width:0}
.acc-t b{display:block;font-size:16px}
.acc-t small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.acc-chev{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--card2);transition:transform .3s ease,background .2s;flex:none}
.acc-chev svg{width:16px;height:16px}

/* ================= עזרים ================= */

function val(r, k) {
  if (!r) return undefined;

    if (isN(r.pts)) return r.pts;

/* ================= נקודות לפי רבע ================= */

/* ---- סטטיסטיקה לפי רבע (נרשמת ברישום מהיר: r.byQ = {1:{...}, 2:{...}}) ---- */

// טבלה: נתון × רבע (ממוצע או ערך)
function qStatTable(perQ, { avg = false, note = "", rate = null } = {}) {   // perQ: [{q, rows:[obj,...]}] · rate: [ערך לכל רבע]

  const rateRow = rate && rIdx.some(i => isN(rate[i])) ? (() => { const vs = rIdx.map(i => rate[i]); const m = vs.filter(isN), b = m.length > 1 ? Math.max(...m) : undefined;

function teamQHtml(tid) {

// לקבוצה: סכום השחקנים בכל רבע, ממוצע על המשחקים
const hasQ = (r) => QS.some(q => isN(r[q]));
const quartersComplete = (rs) => rs.some(hasQ) && rs.every(r => hasQ(r) || !(val(r, "pts") > 0));
/* נתוני קבוצה במשחק (לא לפי שחקן): רבעים, שלשות, קליעות 2, עונשין */
const TS_FIELDS = [["q1","רבע 1"],["q2","רבע 2"],["q3","רבע 3"],["q4","רבע 4"],["ot","הארכה"],["fg3m","שלשות"],["fg2m","קליעות 2"],["ftm","עונשין ✓"],["fta","ניס' ע'"],["pf","עבירות"]];
const tsGet = (g, tid, k) => { const v = g.teamStats?.[tid]?.[k]; return isN(v) ? v : undefined; };
// נקודות לפי רבע של קבוצה במשחק: קודם מה שהוזן לקבוצה, אחרת סכום השחקנים (אם מלא)
function gameQuarters(g, tid) {
  if (QS.some(q => isN(tsGet(g, tid, q)))) return { qs: QS.map(q => tsGet(g, tid, q) ?? 0), ot: tsGet(g, tid, "ot") || 0 };
  const rs = roster(tid).map(p => g.box?.[p.id]).filter(Boolean);
  if (quartersComplete(rs)) return { qs: QS.map(q => sum(rs.map(r => r[q] || 0))), ot: 0 };
  return null;
}
// נתון קבוצתי במשחק: מה שהוזן לקבוצה, אחרת סכום השחקנים (רק אם הוזן לכולם)
function teamGameStats(g, tid) {
  const t = teamTotals(g, tid, true);
  for (const k of ["fg3m","fg2m","ftm","fta","pf"]) { const v = tsGet(g, tid, k); if (isN(v)) t[k] = v; }
  return t;
}
function teamQuarterAvgs(tid) {
  const gs = DB.games.filter(g => isFinal(g) && (g.homeId === tid || g.awayId === tid));
  const mine = [], opp = [];
  for (const g of gs) { const a = gameQuarters(g, tid); if (a) mine.push(a); const b = gameQuarters(g, g.homeId === tid ? g.awayId : g.homeId); if (b) opp.push(b); }
  const av = (arr) => QS.map((q, i) => ({ l: `רבע ${i + 1}`, v: arr.length ? sum(arr.map(x => x.qs[i])) / arr.length : undefined }));
  return { n: mine.length, avgs: av(mine), on: opp.length, opp: av(opp) };
}
function teamQuarterHtml(tid) {
  const qa = teamQuarterAvgs(tid); if (!qa.n) return "";
  const best = qa.avgs.reduce((b, x, i) => (x.v > (qa.avgs[b].v ?? -1) ? i : b), 0);
  return `${quarterBars(qa.avgs)}

      <tr><td class="l">קלענו</td>${qa.avgs.map(x => `<td><b>${f1(x.v)}</b></td>`).join("")}</tr>

      <tr><td class="l">הפרש</td>${qa.avgs.map((x, i) => { const d = x.v - qa.opp[i].v; return `<td class="${d > 0 ? "pos" : d < 0 ? "neg" : ""}">${isN(d) ? sg(d) : "—"}</td>`; }).join("")}</tr>` : ""}
    </tbody></table></div>
    <p class="small dim" style="margin:6px 0 0">הרבע הכי חזק: רבע ${best + 1}. מ-${qa.n} משחקים עם נקודות לפי רבע.</p>`;
}
function gameQuarterTable(g) {

/* ================= פירוט קליעות ================= */
function shootingTable(a, perGame = true) {
  // [שם, כל הקליעות, קליעות עם ניסיונות ידועים, ניסיונות, אחוז, משחקים, נקודות]
  const rows = [
    ["מהשדה (2+3)", a.fgmAll, a.fgm, a.fga, a.fgp, Math.max(a.n2, a.n3), 2 * a.fg2mAll + 3 * a.fg3mAll],
    ["2 נקודות", a.fg2mAll, a.fg2m, a.fg2a, a.fg2p, a.n2, 2 * a.fg2mAll],
    ["3 נקודות", a.fg3mAll, a.fg3m, a.fg3a, a.fg3p, a.n3, 3 * a.fg3mAll],
    ["עונשין", a.ftmAll, a.ftm, a.fta, a.ftp, a.nf, a.ftmAll],
  ].filter(r => r[5] > 0);
  if (!rows.length) return "";
  return `<div class="tbl-wrap"><table><thead><tr><th class="l">סוג זריקה</th><th>נכנסו</th><th>הוחטאו</th><th>ניסיונות</th><th>אחוז</th>${perGame ? "<th>נכנסו למשחק</th>" : ""}<th>נקודות</th><th style="width:22%"></th></tr></thead><tbody>
  ${rows.map(([l, m, mk, at, pc, n, pts], i) => `<tr ${i === 0 ? `class="tot"` : ""}><td class="l">${l}</td><td>${m}</td><td>${at ? at - mk : "—"}</td><td>${at || "—"}</td><td><b>${fp(pc)}</b></td>${perGame ? `<td>${n ? f1(m / n) : "—"}</td>` : ""}<td>${pts}</td>
    <td>${isN(pc) ? `<div class="bar"><i style="width:${(pc * 100).toFixed(0)}%"></i></div>` : ""}</td></tr>`).join("")}</tbody></table></div>`;
}
function ptsFromBar(a) {
  if (!a.from) return "";
  const segs = [["two", "מ-2", "var(--accent)"], ["three", "מ-3", "var(--blue)"], ["ft", "עונשין", "var(--gold)"]].filter(s => a.from[s[0]] > 0);
  return `<div class="card pad"><div class="split small"><b>מאיפה הגיעו הנקודות</b><span class="muted">${a.from.pts} נק' עם פירוט קליעות</span></div>

    <div class="legend">${segs.map(s => `<span><i style="background:${s[2]}"></i>${s[1]} <b>${(a.from[s[0]] * 100).toFixed(0)}%</b></span>`).join("")}</div></div>`;
}
// גרף עמודות של נתון לאורך המשחקים
function trendChart(log, k) {
  const pts = log.map(x => ({ g: x.g, v: k === "eff" ? effOf(x.r) : k === "rate" ? rateOf(x.r) : val(x.r, k) })).filter(x => isN(x.v));
  if (pts.length < 2) return "";
  const max = Math.max(...pts.map(x => x.v), 1), avg = sum(pts.map(x => x.v)) / pts.length;

  </div>`;
}

function pageGames(q) {
  if (!DB.teams.length) return emptyLeague();
  const tf = q.get("team") || "", sf = q.get("s") || "all";
  let gs = sortedGames();
  if (tf) gs = gs.filter(g => g.homeId === tf || g.awayId === tf);

  const groups = new Map();
  for (const g of gs) { const k = g.round ? `מחזור ${g.round}` : fmtDate(g.date); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(g); }

  </div>
  ${[...groups].map(([k, list]) => `<section class="sec"><div class="sec-h"><h2>${esc(k)}</h2><span class="small muted">${list[0].round && list[0].date ? fmtDate(list[0].date) : ""}</span></div><div class="grid g3">${list.map(gameCard).join("")}</div></section>`).join("") || `<div class="card empty">אין משחקים להצגה</div>`}`;
}

// בוקס סקור: מיון בלחיצה, הדגשת השיא בכל עמודה, שורת אחוזים, ולחיצה על שחקן פותחת כרטיס משחק מלא
function boxCols(rows, T, full = true, qMode = false) {
  const has = (fn) => rows.some(x => fn(x.r, x.s));
  const ma = (m, a, k) => k ? `${m}/${a}` : `${m}`;
  const kfg = (s) => (!s.has2 || s.k2) && (!s.has3 || s.k3);
  const pcol = (l, title, m, a, ok, t) => ({ l, title, f:x => ok(x) && a(x) ? fp(m(x) / a(x)) : "—", v:x => ok(x) && a(x) ? m(x) / a(x) : undefined, t, noBest:true, pct:true });
  const cols = [];
  if (full && has(r => isN(r.min))) cols.push({ l:"דק'", f:x => x.r.min ?? "—", v:x => x.r.min, t:"min" });
  if (has(r => isN(val(r, "pts")))) cols.push({ l:"נק'", f:x => val(x.r, "pts") ?? "—", v:x => val(x.r, "pts"), t:"pts", strong:true });
  const fg = has((r, s) => s.has2 || s.has3);
  if (fg && (full || qMode)) {
    cols.push({ l:"שדה", title:"קליעות מהשדה (נכנסו/ניסיונות אם הוזנו)", f:x => (x.s.has2 || x.s.has3) ? ma(x.s.fg2m + x.s.fg3m, x.s.fg2a + x.s.fg3a, kfg(x.s)) : "—", v:x => (x.s.has2 || x.s.has3) ? x.s.fg2m + x.s.fg3m : undefined, t:"fg" });
    if (!qMode && has((r, s) => (s.has2 || s.has3) && kfg(s))) cols.push(pcol("% שדה", "אחוז מהשדה", x => x.s.fg2m + x.s.fg3m, x => x.s.fg2a + x.s.fg3a, x => (x.s.has2 || x.s.has3) && kfg(x.s), "fgp"));
  }
  if (has((r, s) => s.has2)) cols.push({ l:"2 נק'", title:"קליעות של 2 (נכנסו/ניסיונות)", f:x => x.s.has2 ? ma(x.s.fg2m, x.s.fg2a, x.s.k2) : "—", v:x => x.s.has2 ? x.s.fg2m : undefined, t:"fg2" });
  if (!qMode && has((r, s) => s.k2)) cols.push(pcol("% 2", "אחוז מ-2", x => x.s.fg2m, x => x.s.fg2a, x => x.s.k2, "fg2p"));
  if (has((r, s) => s.has3)) cols.push({ l:"3 נק'", title:"שלשות (נכנסו/ניסיונות)", f:x => x.s.has3 ? ma(x.s.fg3m, x.s.fg3a, x.s.k3) : "—", v:x => x.s.has3 ? x.s.fg3m : undefined, t:"fg3" });
  if (!qMode && has((r, s) => s.k3)) cols.push(pcol("% 3", "אחוז מ-3", x => x.s.fg3m, x => x.s.fg3a, x => x.s.k3, "fg3p"));
  if (has((r, s) => s.hasF)) cols.push({ l:"עונשין", title:"עונשין (נכנסו/ניסיונות)", f:x => x.s.hasF ? ma(x.s.ftm, x.s.fta, x.s.kF) : "—", v:x => x.s.hasF ? x.s.ftm : undefined, t:"ft" });
  if (!qMode && has((r, s) => s.kF)) cols.push(pcol("% ע'", "אחוז עונשין", x => x.s.ftm, x => x.s.fta, x => x.s.kF, "ftp"));
  if (full || qMode) {
    if (has(r => isN(r.oreb))) cols.push({ l:"ריב' הת'", title:"ריבאונד התקפה", f:x => x.r.oreb ?? "—", v:x => x.r.oreb, t:"oreb" });
    if (has(r => isN(r.dreb))) cols.push({ l:"ריב' הג'", title:"ריבאונד הגנה", f:x => x.r.dreb ?? "—", v:x => x.r.dreb, t:"dreb" });
  }
  for (const k of ["reb","ast","stl","blk","tov","pf"]) if (has(r => isN(val(r, k)))) cols.push({ l:SL[k].s, title:SL[k].l, f:x => val(x.r, k) ?? "—", v:x => val(x.r, k), t:k, noBest: k === "tov" || k === "pf" });
  if (full && !qMode) for (const q of QS) if (has(r => isN(r[q]))) cols.push({ l:SL[q].s, title:SL[q].l, f:x => x.r[q] ?? "—", v:x => x.r[q], t:q });
  if (rows.some(x => isN(qMode ? rateQ(x.r) : rateOf(x.r)))) cols.push({ l:"⭐ ציון", title:"ציון למשחק 1-10 (לפי כל מה שהוזן)", f:x => rtBadge(qMode ? rateQ(x.r) : rateOf(x.r)), v:x => qMode ? rateQ(x.r) : rateOf(x.r), t:"rate", noBest:true });
  if (!qMode && has(r => isN(r.pm))) cols.push({ l:"+/-", title:SL.pm.l, f:x => isN(x.r.pm) ? `<span class="${x.r.pm > 0 ? "pos" : x.r.pm < 0 ? "neg" : ""}">${sg(x.r.pm, 0)}</span>` : "—", v:x => x.r.pm, t:"pm" });
  if (full && !qMode) {
    const tsOk = (x) => (x.s.has2 || x.s.has3 || x.s.hasF) && kfg(x.s) && (!x.s.hasF || x.s.kF) && isN(val(x.r, "pts"));
    const tsA = (x) => x.s.fg2a + x.s.fg3a + 0.44 * x.s.fta;
    if (rows.some(x => tsOk(x) && tsA(x) > 0)) cols.push(pcol("TS%", "אחוז קליעה אמיתי – כולל שלשות ועונשין", x => val(x.r, "pts") / 2, tsA, tsOk, "ts"));
    if (isN(T?.pts) && T.pts > 0 && has(r => isN(val(r, "pts")))) cols.push({ l:"% מהנק'", title:"איזה חלק מהנקודות של הקבוצה הוא קלע", f:x => isN(val(x.r, "pts")) ? fp(val(x.r, "pts") / T.pts) : "—", v:x => isN(val(x.r, "pts")) ? val(x.r, "pts") / T.pts : undefined, t:"share" });
    if (has(r => isN(effOf(r))) && cols.length > 2) cols.push({ l:"יעי'", title:"יעילות", f:x => effOf(x.r) ?? "—", v:x => effOf(x.r), t:"eff" });
  }
  return cols;
}
function boxTable(g, tid, q = 0) {
  const rOf = (p) => q ? qOf(g.box?.[p.id], q) : g.box?.[p.id];
  const ps = roster(tid).filter(p => rOf(p));
  if (!ps.length) return `<div class="card pad muted small">${q ? `אין נתונים לקבוצה הזו ברבע ${q}.` : "לא הוזנו נתוני שחקנים לקבוצה הזו במשחק."}</div>`;
  let rows = ps.map(p => ({ p, r: rOf(p), s: shoot(rOf(p)) }));
  const T = q ? (teamQ(g, tid, q) || {}) : teamTotals(g, tid);
  const cols = boxCols(rows, T, ui.boxView !== "basic", !!q);
  const key = `box-${g.id}-${tid}-${q}`;
  const st = sortState[key] ||= { t: cols.some(c => c.t === "pts") ? "pts" : "num", d: -1 };
  const sc = cols.find(c => c.t === st.t);
  if (sc) rows.sort((a, b) => { const x = sc.v(a), y = sc.v(b); if (!isN(x) && !isN(y)) return 0; if (!isN(x)) return 1; if (!isN(y)) return -1; return (x - y) * st.d; });
  else rows.sort((a, b) => ((+a.p.number || 999) - (+b.p.number || 999)) * (st.t === "num" ? -st.d : 1));
  const best = cols.map(c => { if (c.noBest) return undefined; const vs = rows.map(c.v).filter(isN); const m = vs.length ? Math.max(...vs) : undefined; return m > 0 ? m : undefined; });
  const all = rows; const S = (k) => sum(all.map(x => x.s[k]));
  const anyS = (f) => all.some(x => x.s[f]);
  const allK = (h, k) => all.every(x => !x.s[h] || x.s[k]);
  const tot = (c) => {
    if (c.t === "fg") return allK("has2", "k2") && allK("has3", "k3") ? `${S("fg2m") + S("fg3m")}/${S("fg2a") + S("fg3a")}` : `${S("fg2m") + S("fg3m")}`;
    if (c.t === "fgp") { const a = S("a2k") + S("a3k"); return a ? fp((S("m2k") + S("m3k")) / a) : "—"; }
    if (c.t === "fg2") return allK("has2", "k2") ? `${S("fg2m")}/${S("fg2a")}` : `${S("fg2m")}`;
    if (c.t === "fg3") return allK("has3", "k3") ? `${S("fg3m")}/${S("fg3a")}` : `${S("fg3m")}`;
    if (c.t === "ft") return allK("hasF", "kF") ? `${S("ftm")}/${S("fta")}` : `${S("ftm")}`;
    if (c.t === "eff") return sum(all.map(x => effOf(x.r)).filter(isN));
    if (c.t === "fg2p") return S("a2k") ? fp(S("m2k") / S("a2k")) : "—";
    if (c.t === "fg3p") return S("a3k") ? fp(S("m3k") / S("a3k")) : "—";
    if (c.t === "ftp") return S("aFk") ? fp(S("mFk") / S("aFk")) : "—";
    if (c.t === "ts") { const ta = aggRows(all.map(x => ({ g, r: x.r }))); return fp(ta.ts); }
    if (c.t === "share") return "100%";
    if (c.t === "rate") { const v = teamRate(g, tid, q); return tid === myTeamId() && isN(v) ? `<span title="ציון ממוצע של הקבוצה">${rtBadge(v)}</span>` : ""; }
    if (c.t === "pm") return "";
    return T[c.t] ?? "—";
  };
  const arrow = (t) => st.t === t ? (st.d < 0 ? " ▾" : " ▴") : "";
  return `<div class="tbl-wrap box"><table><thead><tr>
    <th class="l sticky-col sortable ${st.t === "num" ? "sorted" : ""}" data-act="bsort" data-key="${key}" data-t="num">שחקן${arrow("num")}</th>
    ${cols.map(c => `<th class="sortable ${st.t === c.t ? "sorted" : ""}" data-act="bsort" data-key="${key}" data-t="${c.t}" title="${esc(c.title || "")}">${c.l}${arrow(c.t)}</th>`).join("")}</tr></thead>
  <tbody>${rows.map(x => `<tr class="clickrow" data-act="pgame" data-g="${g.id}" data-p="${x.p.id}" title="לחץ לכרטיס המשחק של ${esc(x.p.name)}">
      <td class="l sticky-col"><span class="dim">${esc(x.p.number ?? "")}</span> <span class="pn">${esc(x.p.name)}</span></td>
      ${cols.map((c, i) => { const v = c.v(x); return `<td class="${isN(best[i]) && v === best[i] ? "best-cell" : ""} ${c.strong ? "strong" : ""}">${c.f(x)}</td>`; }).join("")}</tr>`).join("")}
    <tr class="tot"><td class="l sticky-col">סה"כ</td>${cols.map(c => `<td>${tot(c)}</td>`).join("")}</tr>
  </tbody></table></div>
  <p class="small dim" style="margin:6px 2px 0">👆 לחץ על שחקן לכרטיס מלא · לחץ על כותרת למיון · <span class="best-key">מודגש</span> = הכי טוב בקבוצה</p>`;
}

// כרטיס משחק של שחקן (נפתח מהבוקס סקור או מיומן המשחקים)
function openPlayerGame(gid, pid) {
  const g = game(gid), p = player(pid); if (!g || !p || !g.box?.[pid]) return;
  const r = g.box[pid], t = team(p.teamId), home = g.homeId === p.teamId, opp = team(home ? g.awayId : g.homeId);
  const my = home ? g.homeScore : g.awayScore, ot = home ? g.awayScore : g.homeScore, fin = isFinal(g);
  const a = aggRows([{ g, r }]), season = playerAgg(pid), s = shoot(r);
  const fgm = s.fg2m + s.fg3m, fga = s.fg2a + s.fg3a, pts = val(r, "pts");
  const gmsc = isN(pts) && hasAll(r, ["oreb","dreb","ast","stl","blk","tov"]) ? pts + 0.4 * fgm - 0.7 * fga - 0.4 * (s.fta - s.ftm) + 0.7 * (r.oreb || 0) + 0.3 * (r.dreb || 0) + (r.stl || 0) + 0.7 * (r.ast || 0) + 0.7 * (r.blk || 0) - (r.tov || 0) : undefined;
  const T = teamTotals(g, p.teamId);
  const rtG = rateOf(r);
  const big = [["pts","נקודות"],["reb","ריבאונדים"],["ast","אסיסטים"],["stl","חטיפות"],["blk","חסימות"],["tov","איבודים"],["pf","עבירות"],["min","דקות"]]
    .filter(([k]) => isN(val(r, k))).map(([k, l]) => `<div class="pg-stat"><b>${val(r, k)}</b><span>${l}</span>${k === "reb" && (isN(r.oreb) || isN(r.dreb)) ? `<small>${r.oreb ?? 0} התקפה · ${r.dreb ?? 0} הגנה</small>` : ""}</div>`).join("");
  const adv = [
    isN(a.fgp) && ["אחוז מהשדה", fp(a.fgp), `${a.fgm}/${a.fga}`], isN(a.efg) && ["eFG%", fp(a.efg), "שלשה שווה יותר"], isN(a.ts) && ["TS%", fp(a.ts), "כולל עונשין"],
    isN(a.pps) && ["נק' לזריקה", nd(a.pps, 2), ""], isN(effOf(r)) && ["יעילות", effOf(r), ""], isN(gmsc) && ["Game Score", nd(gmsc), "מדד ביצוע כולל"],
    isN(pts) && isN(T.pts) && T.pts > 0 && ["מנקודות הקבוצה", fp(pts / T.pts), `${pts} מתוך ${T.pts}`],
    isN(r.ast) && isN(r.tov) && r.tov > 0 && ["אסיסט/איבוד", nd(r.ast / r.tov), ""],
  ].filter(Boolean).map(([l, v, sub]) => `<div class="card tile"><span>${l}</span><b>${v}</b>${sub ? `<small> ${sub}</small>` : ""}</div>`).join("");
  const vs = [["pts","נקודות"],["reb","ריבאונדים"],["ast","אסיסטים"],["stl","חטיפות"],["blk","חסימות"],["min","דקות"]].filter(([k]) => isN(val(r, k)) && isN(season.avg[k]) && season.gp > 1);
  if (isN(a.fgp) && isN(season.fgp) && season.gp > 1) vs.push(["fgp", "אחוז מהשדה"]);
  const vsHtml = vs.length ? `<h3 class="pg-h">לעומת הממוצע שלו בעונה</h3><div class="tbl-wrap"><table><thead><tr><th class="l">נתון</th><th>במשחק הזה</th><th>ממוצע עונה</th><th>הפרש</th></tr></thead><tbody>
    ${vs.map(([k, l]) => { const pc = k === "fgp", gv = pc ? a.fgp : val(r, k), sv = pc ? season.fgp : season.avg[k], d = gv - sv, eps = pc ? 0.005 : 0.05;
      return `<tr><td class="l">${l}</td><td><b>${pc ? fp(gv) : gv}</b></td><td>${pc ? fp(sv) : f1(sv)}</td><td class="${d > eps ? "pos" : d < -eps ? "neg" : "dim"}">${d > eps ? "▲ +" : d < -eps ? "▼ " : "= "}${pc ? nd(d * 100) + "%" : f1(d)}</td></tr>`; }).join("")}</tbody></table></div>` : "";
  const sh = shotsFor({ gid, pid });
  const st = shootingTable(a, false);
  const html = `
    <div class="pg-head">
      <div class="jn" style="width:56px;height:56px;border-radius:16px;font-size:22px;background:${esc(t?.color || "var(--card2)")};color:#fff">${esc(p.number ?? "")}</div>
      <div style="min-width:0;flex:1"><h2 style="margin:0">${esc(p.name)}</h2>
        <div class="small muted">${esc(t?.name || "")} · ${home ? "נגד" : "@"} ${esc(opp?.name || "—")} · ${esc(fmtDate(g.date))}</div>
        ${fin ? `<div class="small ${my > ot ? "pos" : "neg"}" style="font-weight:600">${my > ot ? "ניצחון" : "הפסד"} ${my}-${ot}</div>` : ""}</div>
      <button class="iconbtn" data-close="" aria-label="סגירה">✕</button>
    </div>

    ${big ? `<div class="pg-stats">${big}</div>` : ""}
    ${(() => { const per = QN.map(q => ({ q, rows: [qOf(r, q)].filter(Boolean) })); const tb = qStatTable(per, { rate: per.map(x => rateQ(x.rows[0])) }); return tb ? `<h3 class="pg-h">לפי רבע</h3>${tb}` : ""; })()}
    ${st ? `<h3 class="pg-h">קליעות</h3>${st}` : ""}
    ${adv ? `<h3 class="pg-h">מדדים מתקדמים</h3><div class="grid g4 pg-adv">${adv}</div>` : ""}
    ${vsHtml}
    ${sh.length ? `<h3 class="pg-h">מפת זריקות במשחק</h3><div class="court-wrap">${courtSvg(sh)}</div>${zoneTable(sh)}` : ""}
    <div class="row-actions" style="margin-top:16px"><a class="btn pri" href="#/player/${p.id}" data-close="">לפרופיל המלא</a><a class="btn" href="#/game/${g.id}" data-close="">לעמוד המשחק</a></div>`;
  modal(html, (m) => m.classList.add("wide"));
}

/* ================= סטטיסטיקה: הקבוצה שלי, קבוצות וליגה ================= */
const myTeamId = () => (team(DB.league.myTeamId) ? DB.league.myTeamId : (DB.teams[0]?.id || ""));
function teamResults(tid) {
  return sortedGames().filter(g => isFinal(g) && (g.homeId === tid || g.awayId === tid)).map(g => {
    const home = g.homeId === tid, f = home ? g.homeScore : g.awayScore, a = home ? g.awayScore : g.homeScore;
    return { g, f, a, m: f - a, home, opp: team(home ? g.awayId : g.homeId) };
  });
}
const best = (arr, fn) => arr.length ? arr.reduce((b, x) => (fn(x) > fn(b) ? x : b)) : null;
function statTile(label, value, sub = "", href = "", cls = "") {
  const inner = `<span>${label}</span><b class="${cls}">${value}</b>${sub ? `<small>${sub}</small>` : ""}`;
  return href ? `<a class="card tile st-tile" href="${href}">${inner}</a>` : `<div class="card tile st-tile">${inner}</div>`;
}
function rankOf(rows, fn, id, asc = false) {
  const s = rows.filter(r => isN(fn(r))).sort((a, b) => asc ? fn(a) - fn(b) : fn(b) - fn(a));
  const i = s.findIndex(r => r.t.id === id); return i < 0 ? "" : `מקום ${i + 1} בליגה`;
}

  const ratesHtml = rated.length ? `

      ${rated.slice().reverse().map(x => `<tr class="clickrow" onclick="location.hash='#/game/${x.g.id}'"><td class="l">${x.home ? "" : "@ "}${esc(x.opp?.name || "—")}</td><td class="${x.m > 0 ? "pos" : "neg"}">${x.m > 0 ? "נ" : "ה"} ${x.f}-${x.a}</td><td>${rtBadge(x.tr)}</td><td class="l">${x.top ? `${esc(x.top.p.name)} ${rtBadge(x.top.v)}` : "—"}</td></tr>`).join("")}</tbody></table></div>

    (() => { const pr = tots.filter(t => isN(t.ftm) && isN(t.fta)), m = sum(pr.map(t => t.ftm)), a = sum(pr.map(t => t.fta)); return a ? pc("אחוז עונשין", m / a, `${m}/${a}`) : pc("אחוז עונשין", ta.ftp, `${ta.ftm}/${ta.fta}`); })(), pc("eFG%", ta.efg, "שלשה שווה יותר"), pc("TS%", ta.ts, "כולל עונשין"),
    S && S.gp ? pc("אחוז ניצחונות", S.pct, `${S.w} מתוך ${S.gp}`) : "",
    isN(per("ast")?.v) && sumT("tov") ? statTile("אסיסט לאיבוד", nd(sumT("ast") / sumT("tov"), 2), "יחס") : "",
    isN(ta.pps) ? statTile("נקודות לזריקה", nd(ta.pps, 2), "מהשדה") : "",
  ].join("");
  // סה"כ של כל הקבוצה בכל העונה
  const ma = (m, a) => a > m ? `${m}/${a}` : `${m}`;
  const totals = [
    S && S.gp ? statTile("נקודות", S.pf, `ב-${S.gp} משחקים`) : "",
    tots.some(t => isN(t.fg3m)) ? statTile("שלשות", sumT("fg3m"), `${3 * sumT("fg3m")} נק' · ב-${tots.filter(t => isN(t.fg3m)).length} משחקים`) : "",
    tots.some(t => isN(t.fg2m)) ? statTile("קליעות של 2", sumT("fg2m"), `${2 * sumT("fg2m")} נק' · ב-${tots.filter(t => isN(t.fg2m)).length} משחקים`) : "",
    tots.some(t => isN(t.ftm)) ? (() => { const pr = tots.filter(t => isN(t.ftm) && isN(t.fta)), m = sum(pr.map(t => t.ftm)), a = sum(pr.map(t => t.fta));
      return statTile("עונשין", sumT("ftm"), a ? `${m}/${a} נכנסו/ניסיונות · ${fp(m / a)}` : `${sumT("ftm")} נק'`); })() : "",
    tots.some(t => isN(t.reb)) ? statTile("ריבאונדים", sumT("reb")) : "",
    tots.some(t => isN(t.ast)) ? statTile("אסיסטים", sumT("ast")) : "",
    tots.some(t => isN(t.pf)) ? statTile("עבירות", sumT("pf"), `ב-${tots.filter(t => isN(t.pf)).length} משחקים`) : "",
  ].join("");
  if (!avgs && !pcts && !totals) return "";
  return `${totals ? `<div class="mini-h">סה"כ של הקבוצה בעונה</div><div class="grid g4">${totals}</div>` : ""}

const TAP = [
  { id:"fm", l:"עונשין ✓", c:"g", f:r => { inc(r, "ftm"); inc(r, "fta"); bump(r, "pts", 1); addQ(r, 1); } },
  { id:"fx", l:"עונשין ✗", c:"r", f:r => inc(r, "fta") },
  { id:"dr", l:"ריב' הגנה", f:r => { inc(r, "dreb"); bump(r, "reb", 1); } },
  { id:"or", l:"ריב' התקפה", f:r => { inc(r, "oreb"); bump(r, "reb", 1); } },
  { id:"rb", l:"ריבאונד (כללי)", f:r => { r.reb = (val(r, "reb") || 0) + 1; } },
  { id:"as", l:"אסיסט", f:r => inc(r, "ast") }, { id:"st", l:"חטיפה", f:r => inc(r, "stl") },
  { id:"bl", l:"חסימה", f:r => inc(r, "blk") }, { id:"to", l:"איבוד", c:"r", f:r => inc(r, "tov") },
  { id:"pf", l:"עבירה", c:"r", f:r => inc(r, "pf") },
];
function inc(r, k, n = 1) { r[k] = (isN(r[k]) ? r[k] : 0) + n; }
// ברישום מהיר רושמים הכול – אז מה שלא נלחץ הוא באמת 0
const TAP_KEYS = ["fg2m","fg2a","fg3m","fg3a","ftm","fta","oreb","dreb","ast","stl","blk","tov","pf"];
function zeroFill(r) { for (const k of TAP_KEYS) if (!isN(r[k])) r[k] = 0; return r; }
function addQ(r, n) { const g = curGame(); const q = g?.liveQ; if (q >= 1 && q <= 4) inc(r, "q" + q, n); }
// מפעיל פעולה על השחקן ורושם את אותו שינוי גם ברבע הנוכחי
function applyTap(g, pid, fn) {
  const r = zeroFill(g.box[pid] ||= {});
  const q = g.liveQ >= 1 && g.liveQ <= 4 ? g.liveQ : 0;
  const ks = [...TAP_KEYS, "reb", "pts"], v0 = Object.fromEntries(ks.map(k => [k, val(r, k) || 0]));
  fn(r);
  if (g.status === "live") for (const side of ["home", "away"]) { const v = teamTotals(g, g[side + "Id"]).pts; if (isN(v)) g[side + "Score"] = v; }
  if (q) {
    const qo = ((r.byQ ||= {})[q] ||= {});
    for (const k of TAP_KEYS) if (!isN(qo[k])) qo[k] = 0;
    if (!isN(qo.pts)) qo.pts = 0; if (!isN(qo.reb)) qo.reb = 0;
    for (const k of ks) { const d = (val(r, k) || 0) - v0[k]; if (d) qo[k] = (qo[k] || 0) + d; }
  }
  return q;
}
function bump(r, k, n) { if (isN(r[k])) r[k] += n; }               // רק אם הוזן ישירות (אחרת מחושב)
function setPts(r, n) { r.pts = (val(r, "pts") || 0) + n; }
function tapEditor(g, tid) {

        <div class="seg">${QN.map(n => `<button class="${q === n ? "on" : ""}" data-act="liveQ" data-v="${n}">${n}</button>`).join("")}</div></div>
        ${q >= 1 && q <= 4 ? `<button class="btn pri qclose" data-act="closeQ">🏁 ${q < 4 ? `סיים רבע ${q} ← עבור לרבע ${q + 1}` : "סיים רבע 4 – סוף המשחק"}</button>` : !q ? `<button class="btn pri qclose" data-act="liveQ" data-v="1">▶️ התחל רבע 1</button>` : ""}</div>`; })()}
    <div class="small muted">1. בחר שחקן · 2. לחץ על הפעולה. כל לחיצה נשמרת מיד.</div>

    <div class="pl-grid">${ps.map(p => { const r = g.box[p.id]; return `<button class="pl-btn ${p.id === tapSel ? "sel" : ""}" data-act="tapSel" data-id="${p.id}"><b>${esc(p.number ?? "")}</b><span>${esc(p.name)}</span><em>${r ? `${val(r, "pts") ?? 0} נק'` : "&nbsp;"}</em></button>`; }).join("")}</div>
    ${(() => {

          <button class="act g" data-act="shotRes" data-v="1">✓ נכנסה</button><button class="act r" data-act="shotRes" data-v="0">✗ החטאה</button><button class="btn sm" data-act="shotCancel">ביטול</button></div>`
          : `<div class="small dim" style="text-align:center">זריקות של 2 ו-3 – לוחצים על המגרש. עונשין וכל השאר – בכפתורים למטה.</div>`}</div>`;
    })()}
    <div class="act-grid">${TAP.map(a => `<button class="act ${a.c || ""}" data-act="tap" data-a="${a.id}" ${sp ? "" : "disabled style='opacity:.45'"}>${a.l}</button>`).join("")}</div>

  </div>`;
}

function normalize(d) {
  if (!d || typeof d !== "object") d = EMPTY();
  const e = EMPTY();
  d.league = Object.assign(e.league, d.league || {});
  for (const k of ["teams","players","games"]) if (!Array.isArray(d[k])) d[k] = [];
  if (d.league.logo && !okImg(d.league.logo)) delete d.league.logo;
  for (const t of d.teams) if (t.logo && !okImg(t.logo)) delete t.logo;
  for (const g of d.games) { g.box ||= {}; if (!Array.isArray(g.shots)) g.shots = []; g.status ||= (isN(g.homeScore) && isN(g.awayScore) ? "final" : "scheduled"); }
  return d;
}
async function load() {
  let doc = null;
  if (location.protocol === "file:" || window.PREVIEW) MODE = "local";
  else {
    try {
      const r = await fetch("/api/data", { cache:"no-store" });
      if (r.ok && (r.headers.get("content-type") || "").includes("json")) { doc = await r.json(); MODE = "server"; }
      else MODE = "local";
    } catch { MODE = "local"; }
  }
  if (MODE === "server") { DB = normalize(doc.data); REV = doc.rev || 0; }
  else {
    let saved = null; try { saved = JSON.parse(LS.get("league_db") || "null"); } catch {}
    DB = normalize(saved || (window.PREVIEW ? demoData() : null));
  }
}
function commit(rerender = true) {
  dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(persist, 700); pill("busy");
  if (rerender) render();
}
function pill(state, text) {
  let el = $(".save-pill");
  if (!el) { el = document.createElement("div"); el.className = "save-pill"; el.addEventListener("click", () => el.classList.contains("err") && persist()); document.body.appendChild(el); }
  el.className = "save-pill " + state;
  el.textContent = text || { busy:"שומר…", ok:"נשמר ✓", err:"שגיאה בשמירה – לחץ לנסות שוב" }[state];
  if (state === "ok") setTimeout(() => el.classList.contains("ok") && el.remove(), 1800);
}
async function persist(force = false) {
  clearTimeout(saveTimer);
  if (saving) { saveTimer = setTimeout(persist, 400); return; }
  saving = true; pill("busy");
  try {
    if (MODE === "local") { LS.set("league_db", JSON.stringify(DB)); dirty = false; pill("ok"); return; }
    const r = await fetch("/api/data", { method:"PUT", headers:{ "content-type":"application/json", "x-admin-password":ADMIN_PW }, body: JSON.stringify({ data:DB, baseRev:REV, force }) });
    const res = await r.json().catch(() => ({}));
    if (r.ok) { REV = res.rev; dirty = false; pill("ok"); return; }
    if (r.status === 401) { pill("err", "הסיסמה לא נכונה – היכנס שוב"); logout(false); return; }
    if (r.status === 409) {
      pill("err", "התנגשות");
      const v = await modal(`<h2>מישהו אחר עדכן את הנתונים</h2><p class="muted">מאז שפתחת את הדף, השתנו נתונים במכשיר אחר. מה לעשות?</p>
        <div class="row-actions" style="margin-top:14px"><button class="btn pri" data-close="reload">טען את הגרסה החדשה</button><button class="btn danger" data-close="force">דרוס עם הגרסה שלי</button></div>`);
      if (v === "force") { saving = false; return persist(true); }
      if (v === "reload") { DB = normalize(res.current?.data); REV = res.current?.rev || 0; dirty = false; render(); pill("ok", "נטען מחדש"); }
      return;
    }
    if (res.error === "no-password-set") { pill("err", "לא הוגדרה סיסמה ב-Netlify"); return; }
    pill("err");
  } catch { pill("err"); }
  finally { saving = false; }
}
function logout(go = true) { ADMIN_PW = ""; SS.del("league_pw"); if (go) navTo("#/"); else render(); }
async function login(pw) {
  if (MODE === "local") {
    const real = LS.get("league_local_pw") || "1234";

function roundRobin(ids, legs, start, gap) {
  const t = [...ids]; if (t.length % 2) t.push(null);
  const n = t.length, rounds = []; const arr = [...t];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) { const a = arr[i], b = arr[n - 1 - i]; if (a && b) pairs.push(r % 2 ? [b, a] : [a, b]); }
    rounds.push(pairs); arr.splice(1, 0, arr.pop());
  }
  const all = legs === 2 ? [...rounds, ...rounds.map(rs => rs.map(([a, b]) => [b, a]))] : rounds;
  const base = (DB?.games || []).reduce((m, g) => Math.max(m, +g.round || 0), 0);
  const d0 = start ? new Date(start + "T12:00:00") : new Date();
  return all.flatMap((pairs, i) => pairs.map(([h, a]) => {
    const d = new Date(d0); d.setDate(d.getDate() + i * gap);
    return { id: uid(), round: String(base + i + 1), date: d.toISOString().slice(0, 10), homeId: h, awayId: a, status:"scheduled", box:{} };
  }));
}

      const detail = tid === d.league.myTeamId ? "full" : "basic";   // רק הקבוצה שלי עם פירוט מלא, לשאר רק נקודות
      const rows = Object.fromEntries(ps.map(p => [p.id, { fg2m:0, fg2a:0, fg3m:0, fg3a:0, ftm:0, fta:0 }]));
      const W = sum(ps.map(p => p._w)); const wp = () => { let x = rnd() * W; for (const p of ps) { x -= p._w; if (x <= 0) return p; } return ps[0]; };
      const shots = 38 + Math.floor(rnd() * 16) + (side === "home" ? 2 : 0);
      const spot = (three) => { let x, y;
        if (three) { if (rnd() < 0.25) { x = rnd() < 0.5 ? 12 + rnd() * 12 : 476 + rnd() * 12; y = 15 + rnd() * 75; } else { const a = Math.PI * (0.12 + rnd() * 0.76), r = 238 + rnd() * 40; x = 250 + Math.cos(a) * r; y = 52.5 + Math.sin(a) * r; } }
        else if (rnd() < 0.55) { x = 250 + (rnd() - 0.5) * 150; y = 18 + rnd() * 165; }
        else { const a = Math.PI * (0.05 + rnd() * 0.9), r = 105 + rnd() * 105; x = 250 + Math.cos(a) * r; y = 52.5 + Math.sin(a) * r; }
        return { x: Math.round(Math.max(6, Math.min(494, x))), y: Math.round(Math.max(6, Math.min(464, y))) }; };
      for (let i = 0; i < shots; i++) { const p = wp(), R = rows[p.id], t = rnd(); let made;
        if (t < 0.72) { R.fg2a++; made = rnd() < 0.36 + p._w * 0.06; if (made) R.fg2m++; if (detail === "full") g.shots.push({ id: uid(), pid: p.id, ...spot(false), made, three: false }); }
        else if (t < 0.86) { R.fg3a++; made = rnd() < 0.2 + p._w * 0.04; if (made) R.fg3m++; if (detail === "full") g.shots.push({ id: uid(), pid: p.id, ...spot(true), made, three: true }); }
        else { R.fta += 2; R.ftm += (rnd() < 0.6 ? 1 : 0) + (rnd() < 0.55 ? 1 : 0); } }
      let tot = 0;
      ps.forEach((p, i) => { const R = rows[p.id]; const pts = 2 * R.fg2m + 3 * R.fg3m + R.ftm; tot += pts;
        const full = { ...R, min: i < 5 ? 18 + Math.floor(rnd() * 10) : 3 + Math.floor(rnd() * 9), oreb: Math.floor(rnd() * 3 * p._w), dreb: Math.floor(rnd() * 5 * p._w),
          ast: Math.floor(rnd() * 3.5 * p._w), stl: Math.floor(rnd() * 3 * p._w), blk: Math.floor(rnd() * 1.6 * p._w), tov: Math.floor(rnd() * 3.5), pf: Math.floor(rnd() * 4) };
        if (detail === "full") g.box[p.id] = full;
        else if (detail === "basic" && (i < 7 || pts)) g.box[p.id] = { pts };
      });
      g[side + "Score"] = tot;
    }
    if (g.homeScore === g.awayScore) { g.homeScore += 1; const p = Object.keys(g.box).find(id => d.players.find(x => x.id === id)?.teamId === g.homeId);
      if (p) { const R = g.box[p]; if (isN(R.ftm)) { R.ftm++; R.fta++; } else if (isN(R.pts)) R.pts++; } }
  }
  d.games = games; d.players.forEach(p => delete p._w);
  return d;
}

/* ================= הפעלה ================= */
applyTheme();
load().then(() => { render(); }).catch((e) => { console.error(e); $("#app").innerHTML = `<div class="card empty">שגיאה בטעינה</div>`; });

</script>
